name: Build Sensei Client

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Unpack source ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Build Gradle project
        run: |
          cd "$(dirname "$(find source -type f -name build.gradle | head -n 1)")"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SenseiClient-JAR
          path: source/**/*.jar
